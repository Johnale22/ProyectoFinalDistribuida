version: '3.8'

services:
  # 1. Base de Datos Relacional (SQL)
  # Requerimiento: Base principal para integridad (Usuarios, Proyectos)
  postgres:
    image: postgres:15-alpine
    container_name: uce_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: vinculacion_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Base de Datos Documental (NoSQL)
  # Requerimiento: Para Logs, Auditoría y Metadatos de Archivos
  mongo:
    image: mongo:6.0
    container_name: uce_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  # 3. Base de Datos en Caché (Key-Value)
  # Requerimiento: "one must be cache"
  redis:
    image: redis:7-alpine
    container_name: uce_redis
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --requirepass adminpassword

  # 4. Message Broker (Event Driven)
  # Requerimiento: "Mandatory Kafka, Rabbit"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: uce_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    ports:
      - '5672:5672'   # Puerto para que NestJS se conecte
      - '15672:15672' # Puerto para que TU veas el panel web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

# Volúmenes para que los datos no se borren al apagar la PC
volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data: